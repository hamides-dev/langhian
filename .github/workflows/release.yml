name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.3.0)"
        required: false
        default: "v0.3.0"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  release-please:
    name: Release Please
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  prepare:
    name: Prepare Release Metadata
    needs: [release-please]
    if: always() && (needs.release-please.result == 'success' || needs.release-please.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.meta.outputs.tag_name }}
      version: ${{ steps.meta.outputs.version }}
      release_name: ${{ steps.meta.outputs.release_name }}
      release_body: ${{ steps.meta.outputs.release_body }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      make_latest: ${{ steps.meta.outputs.make_latest }}
      generate_release_notes: ${{ steps.meta.outputs.generate_release_notes }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute Release Metadata
        id: meta
        run: |
          CARGO_VERSION=$(sed -n 's/^version = "\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)
          if [ -z "$CARGO_VERSION" ]; then
            CARGO_VERSION="0.3.0"
          fi

          RELEASE_BODY=""

          if [ "${{ needs.release-please.outputs.release_created }}" = "true" ]; then
            TAG_NAME="${{ needs.release-please.outputs.tag_name }}"
            VERSION="${TAG_NAME#v}"
            PRERELEASE="false"
            MAKE_LATEST="true"
            RELEASE_NAME="Langhian Translation ${TAG_NAME}"
            GEN_NOTES="false"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            VERSION="${TAG_NAME#v}"
            PRERELEASE="false"
            MAKE_LATEST="true"
            RELEASE_NAME="Langhian Translation ${TAG_NAME}"
            GEN_NOTES="true"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ github.event.inputs.tag || 'v0.3.0' }}"
            VERSION="${TAG_NAME#v}"
            PRERELEASE="false"
            MAKE_LATEST="true"
            RELEASE_NAME="Langhian Translation ${TAG_NAME}"
            GEN_NOTES="true"
          else
            TAG_NAME="nightly"
            VERSION="${CARGO_VERSION}"
            PRERELEASE="true"
            MAKE_LATEST="false"
            RELEASE_NAME="Langhian Translation Nightly (Pre-release)"
            RELEASE_BODY="Automated nightly build for commit ${GITHUB_SHA}."
            GEN_NOTES="true"
          fi

          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_body=${RELEASE_BODY}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "make_latest=${MAKE_LATEST}" >> "$GITHUB_OUTPUT"
          echo "generate_release_notes=${GEN_NOTES}" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Windows x86_64
    needs: [prepare]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2

      - name: Build Release Binary
        env:
          LANGHIAN_BUILD_SHA: ${{ github.sha }}
          LANGHIAN_BUILD_CHANNEL: ${{ needs.prepare.outputs.prerelease == 'true' && 'nightly' || 'stable' }}
          CARGO_PROFILE_RELEASE_LTO: ${{ needs.prepare.outputs.tag_name == 'nightly' && 'off' || 'thin' }}
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: ${{ needs.prepare.outputs.tag_name == 'nightly' && '16' || '1' }}
        run: cargo build --release --target x86_64-pc-windows-msvc -p langhian-app

      - name: Package Portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/portable | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/langhian.exe dist/portable/langhian.exe
          Copy-Item README.md, LICENSE, THIRD_PARTY_LICENSES.md dist/portable/
          Compress-Archive -Path dist/portable/* -DestinationPath dist/langhian-windows-x86_64.zip -Force

      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = "${{ needs.prepare.outputs.version }}"
          New-Item -ItemType Directory -Force -Path target/release | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/langhian.exe target/release/langhian.exe -Force
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=$version" packaging/windows/langhian.iss

      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            dist/langhian-windows-x86_64.zip
            dist/langhian-setup-windows-x86_64.exe

  build-macos:
    name: macOS (${{ matrix.name }})
    needs: [prepare]
    if: needs.prepare.outputs.tag_name != 'nightly'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arm64
            target: aarch64-apple-darwin
          - name: x86_64
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build Release Binary
        env:
          LANGHIAN_BUILD_SHA: ${{ github.sha }}
          LANGHIAN_BUILD_CHANNEL: ${{ needs.prepare.outputs.prerelease == 'true' && 'nightly' || 'stable' }}
        run: cargo build --release --target ${{ matrix.target }} -p langhian-app

      - name: Package .app and .dmg
        run: |
          mkdir -p dist/dmg/Langhian.app/Contents/MacOS
          mkdir -p dist/dmg/Langhian.app/Contents/Resources
          cp target/${{ matrix.target }}/release/langhian dist/dmg/Langhian.app/Contents/MacOS/langhian
          chmod +x dist/dmg/Langhian.app/Contents/MacOS/langhian
          cp packaging/macos/Info.plist dist/dmg/Langhian.app/Contents/Info.plist

          mkdir -p AppIcon.iconset
          sips -z 16 16     assets/icons/langhian.png --out AppIcon.iconset/icon_16x16.png
          sips -z 32 32     assets/icons/langhian.png --out AppIcon.iconset/icon_16x16@2x.png
          sips -z 32 32     assets/icons/langhian.png --out AppIcon.iconset/icon_32x32.png
          sips -z 64 64     assets/icons/langhian.png --out AppIcon.iconset/icon_32x32@2x.png
          sips -z 128 128   assets/icons/langhian.png --out AppIcon.iconset/icon_128x128.png
          sips -z 256 256   assets/icons/langhian.png --out AppIcon.iconset/icon_128x128@2x.png
          sips -z 256 256   assets/icons/langhian.png --out AppIcon.iconset/icon_256x256.png
          iconutil -c icns AppIcon.iconset -o dist/dmg/Langhian.app/Contents/Resources/AppIcon.icns

          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "Langhian Translation" -srcfolder dist/dmg -ov -format UDZO "dist/langhian-macos-${{ matrix.name }}.dmg"
          tar -czf "dist/langhian-macos-${{ matrix.name }}.tar.gz" -C dist/dmg Langhian.app

      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.name }}
          path: |
            dist/langhian-macos-${{ matrix.name }}.dmg
            dist/langhian-macos-${{ matrix.name }}.tar.gz

  build-linux:
    name: Linux x86_64
    needs: [prepare]
    if: needs.prepare.outputs.tag_name != 'nightly'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libx11-dev \
            libxdo-dev \
            libxtst-dev \
            libxi-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libpipewire-0.3-dev \
            libgbm-dev \
            libdbus-1-dev \
            libasound2-dev

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build Release Binary
        env:
          LANGHIAN_BUILD_SHA: ${{ github.sha }}
          LANGHIAN_BUILD_CHANNEL: ${{ needs.prepare.outputs.prerelease == 'true' && 'nightly' || 'stable' }}
        run: cargo build --release -p langhian-app

      - name: Package .tar.gz and .deb
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"

          mkdir -p dist/tar
          cp target/release/langhian dist/tar/langhian
          cp packaging/linux/langhian.desktop dist/tar/
          cp assets/icons/langhian.png dist/tar/
          cp README.md LICENSE THIRD_PARTY_LICENSES.md dist/tar/
          tar -czf dist/langhian-linux-x86_64.tar.gz -C dist/tar .

          mkdir -p dist/deb/DEBIAN
          mkdir -p dist/deb/usr/bin
          mkdir -p dist/deb/usr/share/applications
          mkdir -p dist/deb/usr/share/icons/hicolor/256x256/apps

          cp target/release/langhian dist/deb/usr/bin/langhian
          chmod 755 dist/deb/usr/bin/langhian
          cp packaging/linux/langhian.desktop dist/deb/usr/share/applications/langhian.desktop
          cp assets/icons/langhian.png dist/deb/usr/share/icons/hicolor/256x256/apps/langhian.png

          printf '%s\n' \
            "Package: langhian" \
            "Version: ${VERSION}" \
            "Section: utils" \
            "Priority: optional" \
            "Architecture: amd64" \
            "Maintainer: Hamid Eslami <hamideslami540@gmail.com>" \
            "Depends: libc6, libgtk-3-0, libayatana-appindicator3-1 | libappindicator3-1, libxdo3, libx11-6, libgbm1, libasound2 | libasound2t64" \
            "Description: Lightweight pure-Rust AI and Google Translate desktop translator" \
            > dist/deb/DEBIAN/control

          dpkg-deb --build dist/deb dist/langhian-linux-amd64.deb

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            dist/langhian-linux-x86_64.tar.gz
            dist/langhian-linux-amd64.deb

  publish:
    name: Publish GitHub Release
    needs: [prepare, build-windows, build-macos, build-linux]
    if: |
      always() &&
      needs.prepare.result == 'success' &&
      needs.build-windows.result == 'success' &&
      (needs.build-macos.result == 'success' || needs.build-macos.result == 'skipped') &&
      (needs.build-linux.result == 'success' || needs.build-linux.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: needs.prepare.outputs.tag_name == 'nightly'

      - name: Update Nightly Tag
        if: needs.prepare.outputs.tag_name == 'nightly'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nightly --yes --cleanup-tag -R "${{ github.repository }}" || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f nightly "${{ github.sha }}"
          git push -f origin nightly

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate Checksums
        run: |
          cd artifacts
          sha256sum * > checksums.txt

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag_name }}
          name: ${{ needs.prepare.outputs.release_name }}
          body: ${{ needs.prepare.outputs.release_body }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.prepare.outputs.make_latest }}
          generate_release_notes: ${{ needs.prepare.outputs.generate_release_notes == 'true' }}
          files: artifacts/*
