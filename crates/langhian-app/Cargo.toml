[package]
name = "langhian-app"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true

[[bin]]
name = "langhian"
path = "src/main.rs"

[dependencies]
langhian-core = { path = "../langhian-core" }
arboard = { version = "3.7", features = ["wayland-data-control"] }
chrono = { version = "0.4", features = ["serde"] }
enigo = "0.3"
iced = { version = "0.14", features = ["tokio", "image", "advanced", "canvas", "svg", "tiny-skia"] }
image = { version = "0.25", default-features = false, features = ["png"] }
open = "5"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util"] }
tray-icon = "0.21"
xcap = "0.9"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
] }
winreg = "0.55"

[target.'cfg(not(target_os = "windows"))'.dependencies]
rdev = "0.5"

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"
