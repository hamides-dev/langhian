[workspace]
resolver = "2"
members = [
    "crates/langhian-core",
    "crates/langhian-app",
]

[workspace.package]
version = "0.1.1"
edition = "2024"
authors = ["Hamid Eslami <hamideslami540@gmail.com>"]
license = "MIT"
repository = "https://github.com/hamides-dev/langhian"
description = "Ultra-lightweight pure-Rust desktop translation daemon with multi-provider AI, free Google Translate, double-tap triggers, vision screenshot translation, and vocabulary highlighting."

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
